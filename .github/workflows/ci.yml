name: CI - Tests and Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run linter
        working-directory: ./backend
        run: npm run lint || echo "Linter issues found but continuing..."
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Check Prisma schema
        working-directory: ./backend
        run: npx prisma format --schema=./prisma/schema.prisma || echo "Prisma schema check skipped"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint || echo "Linter issues found but continuing..."
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}

  validate-files:
    name: Validate Critical Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for .env files
        run: |
          if find . -name ".env" -not -path "./node_modules/*" | grep -q .; then
            echo "⚠️ WARNING: .env files found! Make sure they're in .gitignore"
            find . -name ".env" -not -path "./node_modules/*"
          else
            echo "✅ No .env files found in repository"
          fi
      
      - name: Verify .gitignore
        run: |
          if [ -f .gitignore ]; then
            echo "✅ .gitignore exists"
          else
            echo "❌ .gitignore missing!"
            exit 1
          fi
